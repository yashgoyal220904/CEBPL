<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradient for Logo Mark -->
    <linearGradient id="blueGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DA8E0" />
      <stop offset="100%" stop-color="#F4B340" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DA8E0" />
      <stop offset="100%" stop-color="#1D78B0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4B340" />
      <stop offset="100%" stop-color="#C28720" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Logo Icon (Left) -->
    <!-- Outer Hexagonal Engineering Frame -->
    <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Secondary Inner Gold Grid Lines -->
    <polygon points="50,15 82,33 82,67 50,85 18,67 18,33" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Lightning Bolt / Power Current (Center) -->
    <path d="M52,18 L30,52 L48,52 L38,82 L70,44 L50,44 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    
    <!-- Three dynamic dots representing connectivity/EPC phases -->
    <circle cx="50" cy="5" r="4" fill="#2DA8E0" />
    <circle cx="90" cy="72" r="4" fill="#F4B340" />
    <circle cx="10" cy="72" r="4" fill="#FFFFFF" />
  </g>

  <!-- Text Element (Right) -->
  <!-- Main Title: CEBPL -->
  <text x="120" y="55" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1">
    CEBPL
  </text>
  
  <!-- Subtitle: Full Name -->
  <text x="120" y="80" font-family="'Outfit', 'Inter', sans-serif" font-weight="600" font-size="12" fill="#2DA8E0" letter-spacing="4">
    CHAURASIYA ELECTRICALS
  </text>
  
  <!-- Buildwell Segment -->
  <text x="120" y="98" font-family="'Outfit', 'Inter', sans-serif" font-weight="500" font-size="10" fill="#E2E8F0" letter-spacing="2">
    &amp; BUILDWELL PRIVATE LIMITED
  </text>
</svg>
